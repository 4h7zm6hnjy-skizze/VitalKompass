name: VitalKompass 2.0.13 - Diagramm ganz anzeigen und Zoom reparieren

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/VitalKompass_2.0.13_Gesamtansicht_Zoom.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitalkompass-213-zoom-fit
  cancel-in-progress: false

jobs:
  diagramme-reparieren:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quellcode abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Diagramm, Gesamtansicht und Zoom reparieren
        shell: bash
        run: |
          python3 - <<'PY_VK213'
          from pathlib import Path
          import json
          
          app=Path('app.js'); css=Path('style.css'); sw=Path('sw.js'); version=Path('version.json')
          original={p:p.read_text(encoding='utf-8') for p in (app,css,sw,version)}
          if json.loads(original[version]).get('version') != '2.0.12':
              raise RuntimeError('Sicherheitsabbruch: VitalKompass muss Version 2.0.12 haben. Keine Datei veraendert.')
          s=original[app]
          if "const VERSION='2.0.12'" not in s or 'vk213GlucoseMode' in s:
              raise RuntimeError('Unerwarteter App-Stand; keine Datei veraendert.')
          
          def replace_one(old,new,label):
              global s
              if s.count(old)!=1:raise RuntimeError(label+': erwartet einmal, gefunden '+str(s.count(old)))
              s=s.replace(old,new,1)
          
          replace_one("const VERSION='2.0.12'", "const VERSION='2.0.13'",'Versionswechsel')
          replace_one("let chartPeriods={glucose:'month'", "let vk213GlucoseMode='fit'; // Gesamter Verlauf oder scrollbare Einzelwert-Ansicht. Nur Anzeige, keine Speicherung.\nlet chartPeriods={glucose:'month'",'Ansichtsmodus')
          replace_one("const W=preloaded!==null?720:period==='ten'?560:Math.max(460,Math.min(16000,rows.length*72+80)),H=preloaded!==null?350:410,L=49,R=14,T=29,B=58;",
          "const overview=preloaded===null&&vk213GlucoseMode==='fit';\n const W=preloaded!==null?720:overview?560:Math.max(460,Math.min(16000,rows.length*72+80)),H=preloaded!==null?350:410,L=49,R=14,T=29,B=58;",'Uebersichtsbreite')
          replace_one("preloaded===null&&period!=='ten'?plotW*i/(rows.length-1):useTime?", "(overview||preloaded!==null||period==='ten')&&useTime?",'Zeitverteilung')
          replace_one('return `<circle cx="${x(i)}" cy="${y(r.mgdl)}" r="8" data-vk210-id=',
          'return `<circle cx="${x(i)}" cy="${y(r.mgdl)}" r="${overview?Math.max(2.5,Math.min(5,20/Math.sqrt(rows.length))):8}" data-vk210-id=', 'Punktgroesse')
          replace_one('const labels=vk205PointLabels(labelRows,W,H,L,R,T,B,1,preloaded===null&&period!==\'ten\');',
                      'const labels=vk205PointLabels(labelRows,W,H,L,R,T,B,1,preloaded===null&&!overview);', 'Beschriftung')
          replace_one('class="chartwrap vk207-glucose-wrap ${preloaded===null&&period===\'ten\'?\'vk212-ten-overview\':\'\'}"',
                      'class="chartwrap vk207-glucose-wrap ${overview?\'vk213-overview vk212-ten-overview\':\'vk213-detail\'}"','Diagrammklasse')
          replace_one("preloaded===null&&period!=='ten'?`style=\"width:${W}px;min-width:${W}px;max-width:none\"`:\"\"",
                      "preloaded===null&&!overview?`style=\"width:${W}px;min-width:${W}px;max-width:none\"`:\"\"",'Feste Breite Detailmodus')
          replace_one("if(!wrap.classList.contains('vk212-ten-overview'))wrap.scrollLeft=wrap.scrollWidth;",
                      "if(!wrap.classList.contains('vk213-overview'))wrap.scrollLeft=0;",'Auto-Scroll nicht nach rechts')
          
          old_toolbar="""  toolbar.appendChild(button);wrap.before(toolbar);"""
          new_toolbar="""  if(wrap.classList.contains('vk207-glucose-wrap')){
             const modes=document.createElement('div');modes.className='vk213-modes';modes.setAttribute('role','group');modes.setAttribute('aria-label','Blutzuckerdiagramm Ansicht');
             modes.innerHTML='<button type="button" data-vk213-mode="fit">Ganzes Diagramm anzeigen</button><button type="button" data-vk213-mode="detail">Einzelwerte vergrößern</button>';
             modes.querySelectorAll('[data-vk213-mode]').forEach(b=>{const selected=(b.dataset.vk213Mode===vk213GlucoseMode);b.setAttribute('aria-pressed',String(selected));b.classList.toggle('active',selected)});
             toolbar.appendChild(modes);
            }
            toolbar.appendChild(button);wrap.before(toolbar);"""
          replace_one(old_toolbar,new_toolbar,'Ansichtsschalter')
          
          # Alternativer Ansichtsmodus: kein Editieren, keine Speicherung; der normale Renderer aktualisiert alle Werte.
          old_handler="""const openZoom=e.target.closest('[data-vk207-open]');if(openZoom){vk207OpenZoom(openZoom);return}"""
          new_handler="""const vk213=e.target.closest('[data-vk213-mode]');if(vk213){const mode=vk213.dataset.vk213Mode;if(mode==='fit'||mode==='detail'){vk213GlucoseMode=mode;renderMain()}return}const openZoom=e.target.closest('[data-vk207-open]');if(openZoom){vk207OpenZoom(openZoom);return}"""
          replace_one(old_handler,new_handler,'Klick-Handler')
          
          zoom_start=s.find('function vk207OpenZoom(button){')
          zoom_end=s.find('\nfunction lineChart(',zoom_start)
          if zoom_start<0 or zoom_end<0 or zoom_end-zoom_start>8000:raise RuntimeError('Zoom-Funktion nicht sicher identifiziert')
          new_zoom=r"""function vk207OpenZoom(button){
           const toolbar=button.closest('.vk207-chart-toolbar');
           const wrap=toolbar?.nextElementSibling;
           const source=wrap?.querySelector('svg.chart');
           if(!source)return;
           vk207CloseZoom();vk207ZoomReturnFocus=button;
           const attr=(source.getAttribute('viewBox')||'').trim().split(/\s+/).map(Number);
           const naturalWidth=Math.min(16000,Math.max(200,attr[2]||source.getBoundingClientRect().width||560));
           const naturalHeight=Math.min(1200,Math.max(150,attr[3]||410));
           const modal=document.createElement('div');modal.id='vk207-zoom';modal.className='vk207-modal';
           modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label','Diagramm mit Zoom');
           const heading=wrap.closest('.panel')?.querySelector('h2')?.textContent?.trim()||'Diagramm';
           modal.innerHTML=`<div class="vk207-dialog"><div class="vk207-dialog-header"><strong></strong><div class="vk207-dialog-actions"><button type="button" data-vk212-first>◀ Anfang</button><button type="button" data-vk207-minus aria-label="Diagramm verkleinern">−</button><span class="vk207-percent" aria-live="polite">Einpassen</span><button type="button" data-vk207-plus aria-label="Diagramm vergrößern">+</button><button type="button" data-vk207-reset>Alles einpassen</button><button type="button" data-vk212-last>Ende ▶</button><button type="button" data-vk207-close>Schließen</button></div></div><p class="vk207-zoom-hint">Start: vollständiges Diagramm. Mit − kleiner, mit + größer, per Finger verschieben. „Alles einpassen“ setzt die Ansicht zurück.</p><div class="vk207-zoom-viewport" tabindex="0" aria-label="Diagramm vergrößern, verkleinern und verschieben"><div class="vk207-zoom-canvas"></div></div></div>`;
           modal.querySelector('.vk207-dialog-header strong').textContent=heading;
           const canvas=modal.querySelector('.vk207-zoom-canvas'),viewport=modal.querySelector('.vk207-zoom-viewport');
           const clone=source.cloneNode(true);
           clone.removeAttribute('style');clone.removeAttribute('width');clone.removeAttribute('height');
           clone.setAttribute('preserveAspectRatio','none');
           clone.style.setProperty('display','block','important');clone.style.setProperty('max-width','none','important');
           clone.style.setProperty('min-width','0','important');
           canvas.appendChild(clone);
           document.body.appendChild(modal);document.body.classList.add('vk207-zoom-active');
           // Die Verkleinerung orientiert sich an der tatsaechlich sichtbaren iPhone-Breite,
           // nicht an der SVG-Originalbreite. Dadurch sind auch Diagramme mit 16000px einpassbar.
           const baseWidth=Math.max(200,viewport.clientWidth-4);
           const baseHeight=Math.max(260,Math.min(460,viewport.clientHeight-8,naturalHeight));
           let scale=1;
           function setScale(next){
            const n=Math.max(.5,Math.min(20,Math.round(next*20)/20));
            const centerX=viewport.scrollLeft+viewport.clientWidth/2;
            const old=scale;scale=n;
            const width=baseWidth*scale;
            canvas.style.setProperty('width',width+'px','important');
            canvas.style.setProperty('min-width',width+'px','important');
            canvas.style.setProperty('height','auto','important');
            clone.style.setProperty('width',width+'px','important');
            clone.style.setProperty('height',Math.max(180,baseHeight*Math.min(scale,2))+'px','important');
            viewport.scrollLeft=Math.max(0,centerX*(scale/old)-viewport.clientWidth/2);
            modal.querySelector('.vk207-percent').textContent=Math.round(scale*100)+' %';
            modal.querySelector('[data-vk207-minus]').disabled=scale<=.5;
            modal.querySelector('[data-vk207-plus]').disabled=scale>=20;
           }
           setScale(1);
           viewport.scrollLeft=0;
           modal.addEventListener('click',e=>{
            if(e.target.closest('[data-vk207-close]')){vk207CloseZoom();return}
            if(e.target.closest('[data-vk207-plus]')){setScale(scale+.5);return}
            if(e.target.closest('[data-vk207-minus]')){setScale(scale-.5);return}
            if(e.target.closest('[data-vk207-reset]')){setScale(1);viewport.scrollLeft=0;return}
            if(e.target.closest('[data-vk212-first]')){viewport.scrollLeft=0;return}
            if(e.target.closest('[data-vk212-last]')){viewport.scrollLeft=viewport.scrollWidth;return}
            const pt=e.target.closest('[data-chart-info]');if(pt){vk210OpenPoint(pt);return}
            if(e.target===modal)vk207CloseZoom();
           });
           modal.addEventListener('keydown',e=>{
            if(e.key==='Escape'){e.preventDefault();vk207CloseZoom();return}
            if(e.key==='+'||e.key==='='){e.preventDefault();setScale(scale+.5)}
            if(e.key==='-'){e.preventDefault();setScale(scale-.5)}
           });
           let pinchStart=0,pinchScale=1;
           viewport.addEventListener('touchstart',e=>{
            if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchScale=scale}
           },{passive:true});
           viewport.addEventListener('touchmove',e=>{
            if(e.touches.length===2&&pinchStart>5){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setScale(pinchScale*d/pinchStart)}
           },{passive:false});
           viewport.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStart=0},{passive:true});
           modal.querySelector('[data-vk207-close]').focus();
          }
          """
          s=s[:zoom_start]+new_zoom+s[zoom_end:]
          
          # Nach allen Pruefungen erst Dateien schreiben.
          css_add=r"""
          /* VitalKompass 2.0.13: Gesamtdiagramm auf iPhone lesbar, Detailansicht gesondert scrollbar. */
          #main .vk207-glucose-wrap.vk213-overview{width:100%!important;overflow:hidden!important;touch-action:pan-y;}
          #main .vk207-glucose-wrap.vk213-overview svg.chart{display:block!important;width:100%!important;min-width:0!important;max-width:100%!important;height:auto!important;min-height:0!important;}
          #main .vk207-glucose-wrap.vk213-detail{width:100%!important;overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
          .vk213-modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:100%;}
          .vk213-modes button{border:1px solid #b5d1dd;background:#f1f7fa;color:#154765;padding:10px 7px;border-radius:10px;font-weight:750;white-space:normal;min-height:46px;font-size:.9rem}
          .vk213-modes button.active{background:#0b8077;color:#fff;border-color:#0b8077}
          #main .vk207-chart-toolbar:has(.vk213-modes){flex-wrap:wrap;gap:8px}
          #main .vk207-chart-toolbar:has(.vk213-modes)>.vk207-open-zoom{width:100%;}
          .vk207-zoom-canvas svg.chart{max-width:none!important;min-width:0!important;display:block!important;}
          @media(max-width:480px){.vk213-modes button{font-size:.82rem;padding:8px 4px}}
          @media print{.vk213-modes{display:none!important}}
          """
          new_css=original[css]+css_add
          new_sw=original[sw].replace("const CACHE='vital-kompass-2.0.12-diagrams'","const CACHE='vital-kompass-2.0.13-fit-zoom'")
          if new_sw==original[sw]:
              # Defensive: detect the real cache identifier, independent of the 2.0.12 exact suffix.
              import re
              new_sw, count=re.subn(r"const CACHE='vital-kompass-[^']+'", "const CACHE='vital-kompass-2.0.13-fit-zoom'",original[sw],count=1)
              if count!=1:raise RuntimeError('Cache-Kennung nicht gefunden')
          new_sw=new_sw.replace('VitalKompass 2.0.12:', 'VitalKompass 2.0.13:',1)
          v=json.loads(original[version]);v.update(version='2.0.13',released='2026-11-02',notes='Diagramm: gesamte Blutzuckerkurve standardmaessig passend zur Bildschirmbreite; Detailansicht separat; Zoom von 50 bis 2000 Prozent mit Einpassen; archivierte Monate unveraendert; nur Anzeige, keine Messdaten veraendert.')
          app.write_text(s,encoding='utf-8');css.write_text(new_css,encoding='utf-8');sw.write_text(new_sw,encoding='utf-8');version.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('VitalKompass 2.0.13: Diagramm-Reparatur eingebaut, gespeicherte Messwerte unberuehrt.')
          PY_VK213
      - name: Javascript und Einbau pruefen
        shell: bash
        run: |
          node --check app.js
          node --check hba1c.js
          node - <<'JS_VK213'
          const fs=require('node:fs');const assert=require('node:assert/strict');
          const s=fs.readFileSync('app.js','utf8'),css=fs.readFileSync('style.css','utf8'),v=JSON.parse(fs.readFileSync('version.json','utf8'));
          assert.equal(v.version,'2.0.13');
          assert(s.includes("const VERSION='2.0.13'"));
          assert(s.includes("let vk213GlucoseMode='fit'"));
          assert(s.includes("const W=preloaded!==null?720:overview?560:"));
          assert(s.includes("const overview=preloaded===null&&vk213GlucoseMode==='fit'"));
          assert(s.includes("if(!wrap.classList.contains('vk213-overview'))wrap.scrollLeft=0"));
          assert(s.includes('data-vk213-mode="fit"'));
          assert(s.includes('data-vk213-mode="detail"'));
          assert(s.includes("if(!wrap.classList.contains('vk213-overview'))wrap.scrollLeft=0"));
          assert(s.includes('const baseWidth=Math.max(200,viewport.clientWidth-4)'));
          assert(s.includes('Math.max(.5,Math.min(20,'));
          assert(s.includes('data-vk207-reset'));
          assert(s.includes('function vk212MonthPicker(type)'));
          assert(s.includes('data-vk212-month-step'));
          assert(css.includes('#main .vk207-glucose-wrap.vk213-overview svg.chart'));
          assert(css.includes('width:100%!important;min-width:0!important;max-width:100%!important;height:auto!important;'));
          assert(fs.readFileSync('sw.js','utf8').includes('vital-kompass-2.0.13-fit-zoom'));
          // Verteilung im sichtbaren Uebersichtsdiagramm: alle Daten bleiben erhalten, Breite bleibt 560.
          function graphicWidth(preloaded,period,mode,n){return preloaded!==null?720:(preloaded===null&&(period==='ten'||mode==='fit'))?560:Math.max(460,Math.min(16000,n*72+80))}
          for(const period of ['month','ten'])for(const n of [1,7,45,400])assert.equal(graphicWidth(null,period,'fit',n),560);
          assert(graphicWidth(null,'month','detail',40)>560);
          const base=360;let scales=[.5,1,2,6,20];for(const z of scales){const width=base*z;assert(width>=180&&width<=7200)}
          console.log('OK: Syntax, Monatsarchiv, Originaldaten-Schalter, Gesamtdarstellung, 10-Jahre, Zoom 50-2000%, Offline-Cache.');
          JS_VK213
      - name: Version 2.0.13 veroeffentlichen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css sw.js version.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung notwendig."
          else
            git commit -m "VitalKompass 2.0.13: Gesamtdiagramm und Zoom reparieren"
            git push origin HEAD:main
          fi
