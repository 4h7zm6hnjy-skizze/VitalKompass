              with tarfile.open(fileobj=io.BytesIO(raw),mode="r:gz") as archive:
                  for member in archive.getmembers():
                      if member.name not in {'vk214-update.py','vk214-documents.js','vk214-tests.cjs','vk214-hba-tests.cjs'} or not member.isfile():
                          raise RuntimeError('Unerwarteter Anhang im Updatepaket')
                      with open(os.path.join(temp,member.name),"wb") as target:
                          target.write(archive.extractfile(member).read())
              with open(os.path.join(temp,'vk214-documents.js'),'rb') as f:
                  with open('vk214-documents.js','wb') as dest:dest.write(f.read())
              subprocess.run([sys.executable,os.path.join(temp,'vk214-update.py')],check=True)
