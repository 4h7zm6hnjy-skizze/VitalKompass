      - name: Syntax und Einbindung pruefen
        shell: bash
        run: |
          node --check app.js
          node --check hba1c.js
          node --check vk214-documents.js
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          import json
          app=Path("app.js").read_text()
          index=Path("index.html").read_text()
          sw=Path("sw.js").read_text()
          assert "const VERSION='2.0.14'" in app
          assert "window.VK214.page" in app
          assert "window.VK214?.clear()" in app
          assert "vk214SaveMeta" in app and "vk214SaveUpload" in app
          assert "vk214-documents.js" in index and "vk214-documents.js" in sw
          assert json.loads(Path("version.json").read_text())["version"]=="2.0.14"
          assert "data-hb-window" in Path("hba1c.js").read_text()
          print("App-Code, Offline-Modul, Metadatenablage, HbA1c, Version vorhanden.")
          PY_VERIFY
      - name: Dokumenten- und HbA1c-Tests
        shell: bash
        run: |
          node - <<'NODE_CHECK'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const doc={addEventListener(){},getElementById(){return null}};
          const ctx={document:doc,window:{},Date,Map,Set,Number,Array,String,Math,Intl,Uint8Array};
          vm.runInNewContext(fs.readFileSync('vk214-documents.js','utf8'),ctx);
          assert(typeof ctx.window.VK214.files==='function');
          const sample={evidence:[{id:'a',date:'2026-11-02',filename:'alt.jpg',mime:'image/jpeg',base64:'AAECAw=='},{id:'b',date:'2026-10-12',filename:'befund.jpg',mime:'image/jpeg',base64:'AAECAw==',docMeta:{category:'asthma',date:'2026-01-15',dateConfirmed:true}}]};
          const docs=ctx.window.VK214.files(sample);
          assert.equal(docs.length,2);assert.equal(docs[0].title,'befund.jpg');
          assert.equal(docs[1].date,'','old upload date must not be used');
          ctx.window.VK214.page(sample,{saveMeta:async()=>{},saveUpload:async()=>{}});
          vm.runInNewContext(fs.readFileSync('hba1c.js','utf8'),ctx);
          const hba=ctx.window.VK_HBA1C;
          const anchor=Date.parse('2026-10-01T12:00:00Z');
          const rows=Array.from({length:20},(_,i)=>({date:new Date(anchor+i*86400000).toISOString().slice(0,10),mgdl:110,time:'08:00',type:'glucose',verified:true}));
          assert(hba.rolling(rows,'2026-10-20',30).eligible);
          assert(!hba.rolling(rows,'2026-10-20',60).eligible);
          assert(!hba.rolling(rows,'2026-10-20',90).eligible);
          hba.selectWindow(30);
          assert(hba.homeCard({measurements:rows,labs:[]}).includes('30 Tage'));
          console.log('Tests bestanden: echte Dokumentdaten, unveraenderte Originale, 30/60/90 Tage, Datenschutz.');
          NODE_CHECK
      - name: Neue Version veroeffentlichen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js hba1c.js style.css index.html sw.js version.json vk214-documents.js
          if git diff --cached --quiet; then
            echo "VitalKompass 2.0.14 ist bereits installiert."
          else
            git commit -m "VitalKompass 2.0.14: Dokumentenkopie, Patientenkacheln, HbA1c-Fenster"
            git push origin HEAD:main
          fi
