          HERE=Path('.')
          app=HERE/'app.js'
          style=HERE/'style.css'
          index=HERE/'index.html'
          sw=HERE/'sw.js'
          version=HERE/'version.json'
          for f in (app,style,index,sw,version):
              if not f.exists():
                  raise RuntimeError(f'Datei fehlt: {f}. Keine Aenderungen vorgenommen.')
          
          text=app.read_text(encoding='utf-8')
          if "const VERSION='2.0.11'" in text and (HERE/'hba1c.js').exists():
              print('VitalKompass 2.0.11 ist bereits installiert. Keine weitere Aenderung.')
              raise SystemExit(0)
          if "const VERSION='2.0.10'" not in text:
              raise RuntimeError('Unbekannte App-Version – aus Sicherheitsgruenden abgebrochen.')
          
          # Vor allen Datei-Schreiboperationen: Test aller Strukturmarker.
          original={f:f.read_text(encoding='utf-8') for f in (app,style,index,sw,version)}
          def replace_once(value,old,new,label):
              if value.count(old)!=1:
                  raise RuntimeError(f'{label}: Struktur stimmt nicht mehr, Update sicher abgebrochen ({value.count(old)} Treffer).')
              return value.replace(old,new,1)
          
          out=original[app]
          out=replace_once(out,"const VERSION='2.0.10'","const VERSION='2.0.11'",'Version')
          out=replace_once(out,"const content={start:pageStart,","const content={hba1c:()=>window.VK_HBA1C.page(data),start:pageStart,",'Seiten-Routing')
          out=replace_once(out,
              'function pageStart(){let old=pageStartOld();',
              """function pageStart(){let old=pageStartOld();const hbaAnchor='<div class="metric"><span>Blutdruck diesen Monat</span>';const hbaAt=old.indexOf(hbaAnchor);if(hbaAt>=0){const hbaEnd=old.indexOf('</div>',hbaAt);if(hbaEnd>=0)old=old.slice(0,hbaEnd+6)+window.VK_HBA1C.homeCard(data)+old.slice(hbaEnd+6);}""",
              'Startkarten-Position')
          out=replace_once(out,
              "[['glucose','Diabetes & Blutzucker','◆'],",
              "[['glucose','Diabetes & Blutzucker','◆'],['hba1c','HbA1c / Langzeitblutzucker','◷'],",
              'Menue-Eintrag')
          
          html=replace_once(original[index],
              '<script src="app.js" defer></script>',
              '<script src="hba1c.js" defer></script><script src="app.js" defer></script>',
              'Lade-Reihenfolge')
          newcss=original[style]+ '\n'+base64.b64decode(CSS64).decode('utf-8')+'\n'
          newjs=base64.b64decode(JS64).decode('utf-8')
          newsw=replace_once(original[sw],"'./app.js',","'./app.js','./hba1c.js',",'Offline-Dateiliste')
          newsw=replace_once(newsw,"'app.js','style.css'","'app.js','hba1c.js','style.css'",'Online-Update')
          newsw=replace_once(newsw,"const CACHE='vital-kompass-2.0.10-repair-checked'","const CACHE='vital-kompass-2.0.11-hba1c'",'Cache-Versionskennung')
          newsw=newsw.replace('VitalKompass 2.0.10:', 'VitalKompass 2.0.11:',1)
          vers=json.loads(original[version]);
          if vers.get('version')!='2.0.10':
              raise RuntimeError('Versionsdatei weicht von 2.0.10 ab: Abbruch.')
          vers.update(version='2.0.11',released='2026-11-02',notes='HbA1c-Langzeitblutzucker: lokale 90-Tage-Auswertung mit Ampel, Tabellen, Tag/7 Tage/Woche/Monat/Jahr/10 Jahre; Laborwerte getrennt. Keine Veraenderung der verschluesselten Datenbank.')
          newversion=json.dumps(vers,ensure_ascii=False,indent=2)+'\n'
          
          # Updates sind ausschliesslich Quellcodedateien, keine gespeicherten Gesundheitsdaten.
          app.write_text(out,encoding='utf-8')
          style.write_text(newcss,encoding='utf-8')
          index.write_text(html,encoding='utf-8')
          sw.write_text(newsw,encoding='utf-8')
          version.write_text(newversion,encoding='utf-8')
          (HERE/'hba1c.js').write_text(newjs,encoding='utf-8')
          print('HbA1c-Update 2.0.11 angelegt. Alter Tresor und alle Messwerte unveraendert.')
          PY_VK211
      - name: JavaScript auf Syntax und HbA1c-Berechnung pruefen
        shell: bash
        run: |
          node --check app.js
          node --check hba1c.js
          node - <<'NODE_VK211'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const file=fs.readFileSync('hba1c.js','utf8');
          let api,events=[];
          const dom={addEventListener:(name,fn)=>events.push(name)};
          const sandbox={document:dom,window:{},Date,Set,Map,Number,String,Array,Math,Intl};
          vm.runInNewContext(file,sandbox,{filename:'hba1c.js'});
          api=sandbox.window.VK_HBA1C;
          assert(api&&typeof api.rolling==='function'&&typeof api.page==='function');
          const end='2026-11-02',base=Date.parse(end+'T12:00:00Z');
          const records=[];
          for(let d=0;d<60;d++) {
            const date=new Date(base-d*86400000).toISOString().slice(0,10);
            records.push({date,time:'08:00',type:'glucose',period:'fasting',verified:true,mgdl:108});
          }
          const data={measurements:records,labs:[]};
          const all=api.readings(data);
          assert.equal(all.length,60);
          const s=api.rolling(all,end);
          assert(s.eligible&&s.count===60&&s.days===60);
          assert(Math.abs(s.mean-108)<0.001);
          assert(Math.abs(s.est-(108+46.7)/28.7)<0.0001);
          const old={date:'2026-07-01',mgdl:500};
          assert.equal(api.rolling([...all,old],end).count,60,'Alte Werte ausgeschlossen');
          const unchecked={...records[0],verified:false};
          assert.equal(api.readings({...data,measurements:[...records,unchecked]}).length,60);
          assert(api.homeCard(data).includes('data-view="hba1c"'));
          assert(api.page(data).includes('Langzeitblutzucker-Tabelle'));
          for(const p of ['day','7d','week','month','year','10y'])assert(Array.isArray(api.groups(all,p,end)),p);
          assert(api.groups(all,'7d',end).length<=7);
          assert(fs.readFileSync('index.html','utf8').includes('src="hba1c.js"'));
          assert(fs.readFileSync('sw.js','utf8').includes("'./hba1c.js'"));
          assert(JSON.parse(fs.readFileSync('version.json','utf8')).version==='2.0.11');
          console.log('Tests bestanden: 90-Tage-Rueckblick, Ausschluss ungepruefter Werte, HbA1c-Formel, 6 Zeitraeume, Offline-Datei, Version.');
          NODE_VK211
      - name: Update veroeffentlichen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js hba1c.js style.css index.html sw.js version.json
          if git diff --cached --quiet; then
            echo "VitalKompass ist bereits auf 2.0.11."
          else
            git commit -m "VitalKompass 2.0.11: HbA1c 90-Tage-Auswertung"
            git push origin HEAD:main
          fi
