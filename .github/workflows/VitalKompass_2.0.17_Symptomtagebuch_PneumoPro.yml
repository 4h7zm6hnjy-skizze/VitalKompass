      - name: JavaScript, Verknuepfungen, Datenschutz und Offline Dateien pruefen
        shell: bash
        run: |
          set -e
          node --check app.js
          node --check vk217-symptoms.js
          node --check sw.js
          node --check vk216-specialties.js
          node --check vk214-documents.js
          git diff --check
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import json
          app=Path('app.js').read_text()
          index=Path('index.html').read_text()
          sw=Path('sw.js').read_text()
          js=Path('vk217-symptoms.js').read_text()
          css=Path('vk217-symptoms.css').read_text()
          v=json.loads(Path('version.json').read_text())
          assert v['version']=='2.0.17'
          assert "const VERSION='2.0.17'" in app
          assert 'window.VK217.home(data)' in app and 'symptoms:()=>window.VK217.page(data)' in app
          assert 'window.VK217.calendar(data)' in app and 'window.VK217.reportHTML(data,from,to)' in app
          assert 'window.VK217.attach(' in app and 'window.VK217.reset()' in app
          assert 'vk217-symptoms.js' in index and 'vk217-symptoms.css' in index
          assert 'vk217-symptoms.js' in sw and 'vk217-symptoms.css' in sw
          assert 'indexedDB' not in js and 'localStorage' not in js and 'fetch(' not in js
          assert 'api.save()' in js and 'data-vk217-tag' in js and 'data-vk217-stats-toggle' in js
          assert css.startswith('/* VitalKompass 2.0.17')
          assert "const DB='" not in js
          print('Startseite, Symptomtagebuch, PDF, Kalender, Statistiken, Encryption-API und Offline-Cache vorhanden.')
          PY_CHECK
      - name: Funktionstests mit erfundenen anonymen Beispieldaten
        shell: bash
        run: |
          node <<'JS_TEST'
          const assert=require('node:assert/strict'),fs=require('fs'),vm=require('vm');
          const listeners={};
          const doc={addEventListener:(name,fn)=>{listeners[name]=fn}};
          const ctx={window:{},document:doc,Date,Math,Array,Number,Set,Map,String,RegExp,Intl,console};
          vm.createContext(ctx);vm.runInContext(fs.readFileSync('vk217-symptoms.js','utf8'),ctx);
          const m=ctx.window.VK217;
          const today=new Date().toLocaleDateString('sv-SE');
          const previous=new Date();previous.setDate(previous.getDate()-2);
          const earlier=previous.toLocaleDateString('sv-SE');
          const data={symptoms:[{id:'old',date:today,time:'09:00',kind:'Schwindel',notes:'älterer Eintrag',severity:'leicht'},{id:'new',date:today,time:'09:30',kind:'Altanzeige',tags:['breath-medium','dizzy'],custom:['Kältegefühl','Kribbeln'],rescue:2,severity:'mittel',notes:'Beispiel'}],measurements:[{id:'bp1',type:'bp',date:earlier,time:'09:00',sys:154,dia:96,pulse:112,verified:true},{id:'bp2',type:'bp',date:today,time:'08:00',sys:126,dia:82,pulse:88,verified:true}],oxygenLogs:[{id:'ox1',date:today,time:'07:00',spo2:86},{id:'ox2',date:today,time:'07:30',spo2:95}]};
          assert.equal(m.GROUPS.length,5);
          assert.equal(m.LABELS['breath-medium'],'Mittlere Atemnot');
          const counts=m.statistics(data,'week');
          assert(counts.counts.some(x=>x[0]==='Kribbeln'));
          assert.equal(m.summary(data.symptoms[1]).includes('Kältegefühl'),true);
          assert(m.home(data).includes('data-vk217-tag="dizzy"'));
          assert(m.home(data).includes('vk217-symptom-form'));
          assert(m.home(data).includes('data-vk217-stats-toggle'));
          assert(m.page(data).includes('data-vk217-calendar-body'));
          assert(m.calendar(data).includes('data-vk217-day'));
          assert(m.reportHTML(data,earlier,today).includes('Kribbeln'));
          assert(m.derived(data).some(x=>x.kind==='spo2'&&x.improved&&x.description.includes('07:00')));
          assert(m.derived(data).some(x=>x.kind==='bp'&&x.improved));
          const html=m.reportHTML({symptoms:[{id:'x',date:today,kind:'x',custom:['<img src=x onerror=alert(1)>'],tags:[]}]},today,today);
          assert(!html.includes('<img src=x'));
          assert(html.includes('&lt;img'));
          assert.equal(m.statistics({symptoms:[]},'month').choices,0);
          assert.equal(m.statistics(data,'year').counts.length>=4,true);
          assert.equal(m.statistics(data,'ten').counts.length>=4,true);
          console.log('Mehrfachwahl, eigene Symptome, Altdaten, Zeitraumstatistiken, Kalender, Arztbericht, HTML-Sicherheit, Messwertverbesserung OK.');
          JS_TEST
      - name: Geaenderte Dateien und bestehende Patientendaten schonen
        shell: bash
        run: |
          set -e
          python3 - <<'PY_FILES'
          import subprocess
