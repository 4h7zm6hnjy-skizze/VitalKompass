name: VitalKompass 2.0.3 – Slide-out-Menü und BMI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/VitalKompass_2.0.3_EinDatei.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vital-kompass-203-slideout
  cancel-in-progress: false

jobs:
  sichere-aktualisierung:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Geschützte Aktualisierung der öffentlichen App-Dateien
        shell: bash
        run: |
          python3 - <<'PY_VK203'
          from pathlib import Path
          import hashlib, json, re
          
          BASE='458c9c0a912432ad72dcb8503a846df6f910b450'
          app_path=Path('app.js'); raw=app_path.read_bytes(); app=raw.decode('utf-8')
          blob=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
          if "const VERSION='2.0.3'" in app:
              print('VitalKompass 2.0.3 ist bereits installiert. Keine erneute Änderung.')
              raise SystemExit(0)
          if blob!=BASE:
              raise SystemExit('Quellcode ist nicht mehr die geprüfte Version 2.0.2: '+blob+'. Abbruch zum Schutz späterer Änderungen.')
          if json.loads(Path('version.json').read_text())['version']!='2.0.2':
              raise SystemExit('Versionsstand unerwartet. Keine Änderungen ausgeführt.')
          
          def one(old,new,title):
              global app
              n=app.count(old)
              if n!=1: raise RuntimeError(title+': Erwartet genau einen Fund, gefunden '+str(n))
              app=app.replace(old,new)
          
          def replace_function_line(prefix,new,title):
              global app
              lines=app.splitlines(keepends=True)
              hits=[i for i,line in enumerate(lines) if line.startswith(prefix)]
              if len(hits)!=1:raise RuntimeError(title+': '+str(len(hits))+' Funktionen gefunden')
              lines[hits[0]]=new+'\n';app=''.join(lines)
          
          one("const VERSION='2.0.2'","const VERSION='2.0.3'",'Versionsnummer')
          app=app.replace('function nav(){', '/* VitalKompass 2.0.3: Navigation und Körpermaße – keine Änderungen am Datenspeicher. */\nconst VK203_MENU=[\n [\'Übersicht\',[[\'start\',\'Startseite\',\'⌂\'],[\'profile\',\'Persönliche Daten\',\'♙\']]],\n [\'Messwerte\',[[\'glucose\',\'Diabetes & Blutzucker\',\'◆\'],[\'bp\',\'Blutdruck & Puls\',\'♥\'],[\'weight\',\'Gewicht, BMI & Körperoberfläche\',\'⚖\'],[\'urology\',\'Prostata & Urologie\',\'◈\'],[\'asthma\',\'Asthma-Tagebuch\',\'♧\'],[\'labs\',\'Laborwerte\',\'⊕\'],[\'symptoms\',\'Symptomtagebuch\',\'☷\']]],\n [\'Medikamente & Vorsorge\',[[\'meds\',\'Medikamentenplan\',\'✚\'],[\'medlog\',\'Medikamenteneinnahmen\',\'◷\'],[\'reminders\',\'Kontrollen & Termine\',\'◷\'],[\'prevention\',\'Vorsorge & Notfallplan\',\'✚\'],[\'emergency\',\'Notfallpass\',\'!\']]],\n [\'Auswertung & Berichte\',[[\'analysis\',\'Gesundheitsanalyse\',\'▣\'],[\'pro\',\'Analyse Pro\',\'◈\'],[\'stats\',\'Monats- & Jahresstatistik\',\'▤\'],[\'doctor\',\'Arztbericht / PDF\',\'▤\']]],\n [\'Anträge & Nachweise\',[[\'gdb\',\'GdB & Teilhabe\',\'§\'],[\'evidence\',\'GdB-Nachweise\',\'▤\'],[\'benefits\',\'Krankenkasse & Leistungen\',\'§\']]],\n [\'Einstellungen\',[[\'settings\',\'Backup & Updates\',\'⚙\']]]\n];\nfunction vk203OpenDrawer(){\n const shell=$(\'#vk203-drawer-shell\'),drawer=$(\'#vk203-drawer\'),button=$(\'[data-vk203-open]\');\n if(!shell||!drawer||!button)return;\n drawer.inert=false;drawer.removeAttribute(\'inert\');drawer.setAttribute(\'aria-hidden\',\'false\');\n shell.classList.add(\'is-open\');document.body.classList.add(\'vk203-drawer-open\');button.setAttribute(\'aria-expanded\',\'true\');\n const close=$(\'[data-vk203-close-inside]\',drawer);if(close)close.focus();\n}\nfunction vk203CloseDrawer(restore=true){\n const shell=$(\'#vk203-drawer-shell\'),drawer=$(\'#vk203-drawer\'),button=$(\'[data-vk203-open]\');\n shell?.classList.remove(\'is-open\');document.body.classList.remove(\'vk203-drawer-open\');\n if(drawer){drawer.inert=true;drawer.setAttribute(\'aria-hidden\',\'true\')}\n if(button){button.setAttribute(\'aria-expanded\',\'false\');if(restore)button.focus()}\n}\nfunction vk203SearchMenu(value){\n const term=String(value||\'\').trim().toLocaleLowerCase(\'de\'),sections=$$(\'.vk203-group\');\n let count=0;\n for(const section of sections){let shown=0;\n  for(const button of $$(\'.vk203-menu-item\',section)){\n   const match=!term||button.textContent.toLocaleLowerCase(\'de\').includes(term);\n   button.hidden=!match;if(match){count++;shown++}\n  }\n  section.hidden=shown===0;\n }\n const empty=$(\'#vk203-menu-empty\');if(empty)empty.hidden=count!==0;\n}\nfunction vk203LatestWeight(){\n const measured=(data?.weights||[]).filter(x=>Number.isFinite(x.kg)&&x.kg>0&&dateValid(x.date)&&x.date<=today()).sort(sortdate).at(-1);\n if(measured)return {weight:measured.kg,source:\'Letzte gespeicherte Gewichtsmessung vom \'+fmtDate(measured.date)};\n const profile=nval(data?.profile?.weight);\n return {weight:Number.isFinite(profile)&&profile>0?profile:null,source:\'Gewicht aus den persönlichen Daten (noch keine Messung gespeichert)\'};\n}\nfunction vk203Calculate(weightKg,heightCm){\n const w=Number(String(weightKg??\'\').replace(\',\',\'.\')),height=Number(String(heightCm??\'\').replace(\',\',\'.\'));\n if(!Number.isFinite(w)||!Number.isFinite(height)||w<2||w>400||height<100||height>250)return null;\n return {bmi:w/((height/100)**2),bsa:Math.sqrt((height*w)/3600)};\n}\nfunction vk203MetricsOutput(weight,height){\n const r=vk203Calculate(weight,height);\n if(!r)return \'<p class="vk203-metric-wait">Bitte gültige Körpergröße und Gewicht eintragen, um BMI und Körperoberfläche zu berechnen.</p>\';\n return `<div class="vk203-metric-result-grid"><div class="vk203-metric-number"><span>BMI</span><strong>${nf(r.bmi,1)}</strong><small>kg/m²</small></div><div class="vk203-metric-number"><span>Körperoberfläche</span><strong>${nf(r.bsa,2)}</strong><small>m² · Mosteller</small></div></div>`;\n}\nfunction vk203MetricPanel(){\n const entry=vk203LatestWeight(),height=data?.profile?.height||\'\',weight=entry.weight??\'\';\n return panel(\'BMI & Körperoberfläche\',`<p class="section-note">Automatisch berechnet mit der gespeicherten Körpergröße und der neuesten Gewichtsmessung. Neue Messungen aktualisieren die Werte beim Speichern.</p><div class="vk203-metric-fields"><label class="field"><span>Körpergröße (cm)</span><input id="vk203-height" inputmode="decimal" type="text" value="${h(height)}" aria-label="Körpergröße für BMI und Körperoberfläche"></label><label class="field"><span>Gewicht (kg)</span><input id="vk203-weight" inputmode="decimal" type="text" value="${h(weight)}" aria-label="Gewicht für BMI und Körperoberfläche"></label></div><div class="vk203-metric-result" id="vk203-metric-output" role="status" aria-live="polite">${vk203MetricsOutput(weight,height)}</div><p class="section-note">${h(entry.source)}. Du kannst beide Werte im Rechner testweise ändern. Diese Vorschau speichert nichts; zum dauerhaften Ändern die persönlichen Daten oder das Gewichtstagebuch verwenden. Der BMI ist nur ein grober Orientierungswert und keine Diagnose.</p>`);\n}\nfunction vk203Recalculate(){const output=$(\'#vk203-metric-output\');if(output)output.innerHTML=vk203MetricsOutput($(\'#vk203-weight\')?.value,$(\'#vk203-height\')?.value)}\nfunction vk203MetricMini(){\n const entry=vk203LatestWeight(),calc=vk203Calculate(entry.weight,data?.profile?.height);\n return `<div class="vk203-home-metric"><div><strong>Körpermaße</strong><span>${calc?\'BMI \'+nf(calc.bmi,1)+\' · Körperoberfläche \'+nf(calc.bsa,2)+\' m²\':\'Größe und Gewicht ergänzen\'}</span></div><button type="button" data-view="weight">Rechner öffnen</button></div>`;\n}\nfunction vk203HomeQuick(){\n return `<section class="vk203-home-quick" aria-label="Häufig verwendet"><h2>Schnell erfassen</h2><div class="vk203-home-grid">${[[\'glucose\',\'Blutzucker\'],[\'bp\',\'Blutdruck\'],[\'weight\',\'Gewicht / BMI\'],[\'labs\',\'Laborwerte\'],[\'stats\',\'Statistiken\'],[\'doctor\',\'Arztbericht\']].map(([v,t])=>`<button type="button" data-view="${v}">${t}</button>`).join(\'\')}</div><p class="section-note">Alle weiteren Bereiche findest du über „Menü“ oben.</p></section>`;\n}\nfunction nav(){', 1)
          replace_function_line('function nav(){','function nav(){return `<div class="vk203-drawer-shell" id="vk203-drawer-shell"><button class="vk203-backdrop" type="button" data-vk203-close aria-label="Menü schließen" tabindex="-1"></button><aside id="vk203-drawer" class="vk203-drawer" role="dialog" aria-modal="true" aria-label="VitalKompass Hauptmenü" aria-hidden="true" inert><header class="vk203-drawer-header"><div><strong>VitalKompass</strong><small>Alle Bereiche</small></div><button type="button" class="vk203-drawer-x" data-vk203-close-inside aria-label="Menü schließen">✕</button></header><label class="vk203-search-label" for="vk203-search">Bereich suchen</label><input id="vk203-search" type="search" autocomplete="off" placeholder="z. B. Labor, Prostata, GdB"><nav class="vk203-menu-list" aria-label="App-Bereiche">${VK203_MENU.map(([group,items])=>`<section class="vk203-group"><h3>${h(group)}</h3>${items.map(([id,label,symbol])=>`<button class="vk203-menu-item" type="button" data-view="${id}" aria-current="${view===id?\'page\':\'false\'}"><span class="vk203-menu-symbol" aria-hidden="true">${symbol}</span><span>${h(label)}</span></button>`).join(\'\')}</section>`).join(\'\')}</nav><p class="vk203-menu-empty" id="vk203-menu-empty" hidden>Keinen passenden Bereich gefunden.</p><p class="vk203-menu-footer">Gesundheitsdaten bleiben lokal verschlüsselt gespeichert.</p></aside></div>`}','Menüfunktion')
          replace_function_line('function common(){','function common(){document.body.classList.remove(\'vk203-drawer-open\');document.body.classList.toggle(\'senior-mode\',data?.settings?.seniorMode===true);root.innerHTML=`<header class="topbar vk203-topbar"><button class="vk203-menu-trigger" type="button" data-vk203-open aria-controls="vk203-drawer" aria-expanded="false"><span aria-hidden="true">☰</span><span>Menü</span></button><div class="brand"><img src="icon-192.png" alt="VitalKompass Logo"><div><strong>VitalKompass</strong><small>Mein Gesundheitsjournal</small></div></div><span class="version">Version ${VERSION}</span><button class="quiet" data-action="lock" type="button">Sperren</button></header><div class="layout">${nav()}<main id="main"></main><nav class="vk-bottom-nav" aria-label="Schnellnavigation"><button type="button" data-view="glucose" aria-current="${view===\'glucose\'?\'page\':\'false\'}">Diabetes</button><button type="button" data-view="urology" aria-current="${view===\'urology\'?\'page\':\'false\'}">Prostata</button><button type="button" data-view="bp" aria-current="${view===\'bp\'?\'page\':\'false\'}">Blutdruck</button></nav><footer class="foot">Daten ausschließlich auf diesem Gerät · Passwortgeschützt · Keine automatische ärztliche Diagnose oder Medikamentenprüfung · <b>Version ${VERSION}</b></footer></div>`;renderMain()}','Hauptlayout')
          replace_function_line('function pageStart(){','function pageStart(){let old=pageStartOld();const start=\'<div class="biglinks" style="margin:16px 0">\';const i=old.indexOf(start);if(i>=0){const end=old.indexOf(\'</div>\',i);if(end>=0)old=old.slice(0,i)+vk203HomeQuick()+old.slice(end+6)}const point=\'<div class="main-grid">\';return old.includes(point)?old.replace(point,vkDashboard()+vk203MetricMini()+point):old+vkDashboard()+vk203MetricMini()}','Startseite')
          one("+profileCard()+panel('Angaben ändern'","+profileCard()+vk203MetricPanel()+panel('Angaben ändern'",'Rechner im Profil')
          one('+pageWeightOld()+vkWeightGoalPanel()}','+vk203MetricPanel()+pageWeightOld()+vkWeightGoalPanel()}','Rechner im Gewichtstagebuch')
          one("root.addEventListener('click',e=>{const point=e.target.closest('[data-chart-info]');","root.addEventListener('click',e=>{if(e.target.closest('[data-vk203-open]')){vk203OpenDrawer();return}if(e.target.closest('[data-vk203-close]')||e.target.closest('[data-vk203-close-inside]')){vk203CloseDrawer();return}const point=e.target.closest('[data-chart-info]');",'Menü-Öffnen und Schließen')
          one("if(navButton){view=navButton.dataset.view;","if(navButton){vk203CloseDrawer(false);view=navButton.dataset.view;",'Navigationswechsel')
          one("root.addEventListener('submit',handleSubmit);","document.addEventListener('keydown',e=>{if(!document.body.classList.contains('vk203-drawer-open'))return;if(e.key==='Escape'){e.preventDefault();vk203CloseDrawer();return}if(e.key!=='Tab')return;const drawer=$('#vk203-drawer');if(!drawer)return;const focusable=$$('button:not([hidden]):not(:disabled), input:not([hidden]):not(:disabled)',drawer).filter(x=>!x.closest('[hidden]'));if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});\nroot.addEventListener('submit',handleSubmit);",'Tastaturbedienung')
          one("const el=e.target;\nif(el.closest('#lab-form')){", "const el=e.target;\nif(el.id==='vk203-search'){vk203SearchMenu(el.value);return}\nif(el.id==='vk203-height'||el.id==='vk203-weight'){vk203Recalculate();return}\nif(el.closest('#weight-form')&&el.name==='kg'){const w=$('#vk203-weight');if(w){w.value=el.value;vk203Recalculate()}return}\nif(el.closest('#personal-form')&&(el.name==='height'||el.name==='weight')){const target=$(el.name==='height'?'#vk203-height':'#vk203-weight');if(target){if(el.name==='height'||!(data.weights||[]).length)target.value=el.value;vk203Recalculate()}return}\nif(el.closest('#lab-form')){",'Sofortberechnung / Suche')
          CSS="\n/* VitalKompass 2.0.3 – aufgeräumtes Slide-out-Menü und gut lesbare Schnellnavigation */\n.vk203-topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}\n.vk203-topbar .brand{flex:1;min-width:0}\n.vk203-topbar .vk203-menu-trigger{background:#fff;color:#164c73;border:1px solid #c8e1ee;border-radius:12px;min-height:50px;display:flex;gap:9px;align-items:center;justify-content:center;padding:10px 14px;font-size:1rem;font-weight:850}\n.vk203-topbar .vk203-menu-trigger span:first-child{font-size:1.5rem;line-height:1}\n.vk203-topbar .vk203-menu-trigger:focus-visible{outline:3px solid #ffce66;outline-offset:3px}\n.vk203-drawer-shell{position:fixed;inset:0;z-index:100;visibility:hidden;pointer-events:none}\n.vk203-drawer-shell.is-open{visibility:visible;pointer-events:auto}\n.vk203-backdrop{position:absolute;inset:0;border:0;width:100%;height:100%;padding:0;border-radius:0;background:#10273ccc;opacity:0;transition:opacity .22s ease}\n.vk203-drawer{position:absolute;left:0;top:0;bottom:0;width:min(420px,calc(100vw - 30px));background:#f7fafd;box-shadow:14px 0 38px #102c4566;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-103%);transition:transform .22s ease;padding:0 15px calc(26px + env(safe-area-inset-bottom));color:#143a58}\n.vk203-drawer-shell.is-open .vk203-backdrop{opacity:1}\n.vk203-drawer-shell.is-open .vk203-drawer{transform:translateX(0)}\nbody.vk203-drawer-open{overflow:hidden}\n.vk203-drawer-header{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#123f66;color:white;padding:calc(17px + env(safe-area-inset-top)) 17px 16px;margin:0 -15px 14px;border-radius:0 0 14px 14px}\n.vk203-drawer-header strong{font-size:1.3rem;display:block}\n.vk203-drawer-header small{font-size:.9rem;display:block;color:#daebf7;margin-top:3px}\n.vk203-drawer-x{background:white;color:#174765;border:0;border-radius:12px;width:48px;height:48px;min-width:48px;font-size:1.35rem}\n.vk203-search-label{display:block;font-size:.96rem;font-weight:800;margin:12px 4px 7px}\n#vk203-search{width:100%;font-size:16px;min-height:51px;padding:12px 14px;border:1.5px solid #9ebfd4;border-radius:12px;background:white;color:#17314c}\n.vk203-menu-list{display:block;margin:13px 0 5px}\n.vk203-group{margin:10px 0 15px;border-radius:14px;padding:8px;background:white;border:1px solid #d6e5ee}\n.vk203-group[hidden],.vk203-menu-item[hidden]{display:none!important}\n.vk203-group h3{font-size:1.01rem;margin:5px 7px 8px;padding:4px 3px 10px;color:#265b81;border-bottom:1px solid #dce8ef;font-weight:850}\n.vk203-menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:55px;border:0;border-bottom:1px solid #edf2f5;border-radius:9px;background:transparent;text-align:left;color:#17314c;font-size:1.03rem;font-weight:730;padding:9px 10px;line-height:1.35}\n.vk203-menu-item:last-child{border-bottom:0}\n.vk203-menu-item[aria-current='page']{background:#dbeef8;color:#124b75;box-shadow:inset 4px 0 #176ca3}\n.vk203-menu-item:focus-visible{outline:3px solid #f0ad29;outline-offset:1px}\n.vk203-menu-symbol{display:flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:9px;background:#e7f1f7;color:#14567e;font-size:1.12rem;font-weight:900}\n.vk203-menu-footer,.vk203-menu-empty{margin:15px 5px 8px;color:#506d80;font-size:.89rem}\n.vk-bottom-nav{gap:7px;padding:9px max(9px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left))}\n.vk-bottom-nav button{font-size:.98rem;min-height:51px;letter-spacing:0;padding:12px 4px;border-radius:11px;overflow-wrap:normal;white-space:nowrap}\n.vk203-home-quick{background:white;border:1px solid #d2e2eb;border-radius:15px;padding:15px;margin:14px 0}\n.vk203-home-quick h2{font-size:1.18rem;margin:0 0 12px;color:#193d5b}\n.vk203-home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}\n.vk203-home-grid button{background:#edf5fb;border:1px solid #c2d9e9;border-radius:11px;min-height:56px;color:#1d5277;font-size:.96rem;font-weight:800;padding:10px 6px;line-height:1.25}\n.vk203-home-quick .section-note{margin:11px 0 0}\n.vk203-home-metric{background:#fff;border:1px solid #c7dce7;border-left:4px solid #117d83;border-radius:13px;padding:13px 15px;display:flex;gap:12px;justify-content:space-between;align-items:center;margin:13px 0}\n.vk203-home-metric strong,.vk203-home-metric span{display:block}.vk203-home-metric strong{font-size:1.02rem}.vk203-home-metric span{font-size:.95rem;margin-top:6px}\n.vk203-home-metric button{border:0;border-radius:9px;min-height:44px;flex:none;padding:9px 13px;background:#156d89;color:white;font-size:.9rem;font-weight:800}\n.vk203-metric-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:13px 0}\n.vk203-metric-fields input{font-size:16px;min-height:48px;width:100%}\n.vk203-metric-result{background:#f1f8fc;border:1px solid #c6dfea;border-radius:14px;padding:14px;margin:12px 0}\n.vk203-metric-result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.vk203-metric-number{background:white;border-radius:11px;border:1px solid #d4e7f1;padding:13px 10px;text-align:center}\n.vk203-metric-number span,.vk203-metric-number small{display:block;color:#365c72}\n.vk203-metric-number span{font-size:.95rem;font-weight:800}\n.vk203-metric-number strong{display:block;font-size:1.9rem;color:#124b6c;margin:7px 0}\n.vk203-metric-number small{font-size:.81rem}\n.vk203-metric-wait{margin:0;color:#506b7d}\n@media screen and (max-width:700px){\n .vk203-topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'menu brand lock' 'version version version';gap:10px 9px;align-items:center;padding:12px 10px}\n .vk203-topbar .vk203-menu-trigger{grid-area:menu;padding:9px 11px;min-height:48px}\n .vk203-topbar .brand{grid-area:brand;min-width:0;display:flex;gap:7px}\n .vk203-topbar .brand img{width:33px;height:33px;flex:none}\n .vk203-topbar .brand strong{font-size:1rem}\n .vk203-topbar .brand small{font-size:.73rem}\n .vk203-topbar .version{grid-area:version;justify-self:start;font-size:.75rem}\n .vk203-topbar [data-action='lock']{grid-area:lock;min-height:45px;padding:9px 10px;font-size:.9rem}\n .vk203-home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}\n .vk203-home-metric{align-items:stretch;flex-direction:column}\n .vk203-home-metric button{width:100%}\n}\n@media(max-width:355px){.vk203-topbar .brand small{display:none}.vk203-topbar .vk203-menu-trigger span:last-child{display:none}.vk-bottom-nav button{font-size:.89rem}}\nbody.senior-mode .vk203-menu-item{font-size:1.14rem;min-height:64px}\nbody.senior-mode .vk203-home-grid button{font-size:1.05rem}\n@media(prefers-reduced-motion:reduce){.vk203-drawer,.vk203-backdrop{transition:none}}\n@media print{.vk203-drawer-shell,.vk203-menu-trigger,.vk203-home-quick,.vk203-home-metric{display:none!important}}\n"
          Path('app.js').write_text(app,encoding='utf-8')
          Path('style.css').write_text(Path('style.css').read_text(encoding='utf-8')+CSS,encoding='utf-8')
