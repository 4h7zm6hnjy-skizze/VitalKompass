          sw=sw.replace('VitalKompass 2.0.2','VitalKompass 2.0.3').replace('vital-kompass-2.0.2-chart-traffic-last7','vital-kompass-2.0.3-drawer-bmi-bsa')
          Path('sw.js').write_text(sw,encoding='utf-8')
          Path('version.json').write_text(json.dumps({'version':'2.0.3','released':'2026-10-29','notes':'Ausziehbares gruppiertes Menü, Suchfunktion, große lesbare Navigation, unten nur Diabetes/Prostata/Blutdruck. BMI und Körperoberfläche nach Mosteller mit live aktualisiertem Gewichtsrechner. Lokale Datenspeicherung und Offlinefähigkeit unverändert.'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          readme+='\n\n## Version 2.0.3 – Slide-out-Menü und automatische Körpermaße\n\n- Menü oben links öffnet ein gruppiertes Seitenmenü; Bereiche sind groß beschriftet und durchsuchbar. Es schließt durch Auswahl, Schließen-Taste, den dunklen Hintergrund oder Escape.\n- Die untere Schnellnavigation zeigt nur Diabetes, Prostata, Blutdruck. Startseite bietet sechs häufig verwendete Aktionen, alle weiteren Punkte sind im Menü erreichbar.\n- BMI=Gewicht(kg)/Körpergröße(m)^2; Körperoberfläche nach Mosteller = Quadratwurzel aus (Größe(cm)×Gewicht(kg)/3600). Neueste gespeicherte Messung hat Vorrang vor dem Profilgewicht. Vorschau aktualisiert sich beim Tippen oder nach dem Speichern, speichert aber keine Werte selbst.\n- Vor Installation verschlüsseltes Backup erstellen. Safari-Websitedaten nicht löschen. Es werden nur öffentliche Programmdateien verändert, keine persönlichen Patientendaten.\n- Browser-Syntax und strukturelle Regressionen im GitHub-Workflow; echter iPhone-Safari-Test ist noch erforderlich.\n'
          Path('README.md').write_text(readme,encoding='utf-8')
          print('Vorschau-Update 2.0.3 vorbereitet; bestehende Gesundheitsdatenbank unverändert.')
          PY_VK203
      - name: JavaScript-Syntax und Funktionalität prüfen
        shell: bash
        run: |
          node --check app.js
          node --check sw.js
          python3 -m json.tool version.json > /dev/null
          node - <<'NODE_VK203'
          const fs=require('fs'),assert=require('assert');
          const app=fs.readFileSync('app.js','utf8'),css=fs.readFileSync('style.css','utf8');
          assert(app.includes("const VERSION='2.0.3'"));
          assert(app.includes("DB='vitalkompass-secure-v1'"));
          assert(app.includes('function vk203OpenDrawer()')&&app.includes('function vk203CloseDrawer('));
          assert(app.includes('function vk203SearchMenu(value)'));
          assert(app.includes('function vk203MetricPanel()'));
          assert(app.includes('function vk203LatestWeight()'));
          assert(app.includes('vk203MetricPanel()+pageWeightOld()'));
          assert(app.includes('profileCard()+vk203MetricPanel()'));
          assert(css.includes('.vk203-drawer-shell.is-open'));
          assert(app.includes('vk203CloseDrawer(false);view=navButton.dataset.view'));
          const all=app.match(/^function common\(\)\{.*$/m)[0];
          const fast=[...all.matchAll(/data-view=\"(.*?)\"/g)].map(x=>x[1]);
          assert.deepStrictEqual(fast,['glucose','urology','bp']);
          const groups=[...app.matchAll(/\['(start|profile|glucose|bp|weight|urology|asthma|labs|symptoms|meds|medlog|reminders|prevention|emergency|analysis|pro|stats|doctor|gdb|evidence|benefits|settings)','/g)].map(x=>x[1]);
          for (const p of ['start','profile','glucose','bp','weight','urology','asthma','labs','symptoms','meds','medlog','reminders','prevention','emergency','analysis','pro','stats','doctor','gdb','evidence','benefits','settings'])assert(groups.includes(p),'Menüeintrag fehlt: '+p);
          const formula=app.slice(app.indexOf('function vk203Calculate('),app.indexOf('function vk203MetricsOutput('));
          const calc=(new Function(formula+';return vk203Calculate;'))();
          const t=calc(130,192);assert(Math.abs(t.bmi-35.2643)<0.01);assert(Math.abs(t.bsa-Math.sqrt(130*192/3600))<0.00001);
          assert(calc('',192)===null || calc('',192)?.bmi===0,'leeres Gewicht sollte nicht valide sein');
          assert(calc(130,0)===null);
          assert(calc(125,192).bmi<t.bmi&&calc(125,192).bsa<t.bsa);
          const latestCode=app.slice(app.indexOf('function vk203LatestWeight('),app.indexOf('function vk203Calculate('));
          const patient={profile:{height:'192',weight:'120'},weights:[{date:'2026-10-20',kg:125,time:'08:00'}]};
          const latest=new Function('data','dateValid','today','sortdate','fmtDate','nval',latestCode+';return vk203LatestWeight;')(patient,()=>true,()=> '2026-10-29',(a,b)=>(a.date+a.time).localeCompare(b.date+b.time),x=>x,x=>Number(x));
          assert(latest().weight===125,'Neueste Messung muss vor Profilgewicht gelten');
          patient.weights.push({date:'2026-10-29',time:'19:00',kg:130});
          assert(latest().weight===130,'Neue Messung muss automatisch berücksichtigt werden');
          patient.weights=[];
          assert(latest().weight===120,'Ohne Tagebuchmessung muss Profilgewicht genutzt werden');
          assert(app.includes("el.id==='vk203-weight'"),'Live-Vorschau fehlt');
          assert(app.includes("el.closest('#weight-form')&&el.name==='kg'"),'Gewichtseingabe aktualisiert Vorschau nicht');
          console.log('Checks: 22 Menüpunkte, drei Schnellzugriffe, automatische Gewichtsauswahl, BMI / Mosteller und Syntaxanker OK.');
          NODE_VK203
      - name: Update nach erfolgreicher Prüfung veröffentlichen
        shell: bash
        run: |
          if git diff --quiet -- app.js style.css sw.js version.json README.md; then
            echo 'Keine Dateien geändert; Version ist bereits aktuell.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js style.css sw.js version.json README.md
          git commit -m 'VitalKompass 2.0.3: Slide-out-Menü und BMI/Körperoberfläche'
