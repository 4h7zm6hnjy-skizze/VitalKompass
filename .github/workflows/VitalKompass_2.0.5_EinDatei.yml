            h:s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),
            nf:(v,d=0)=>Number.isFinite(v)?v.toLocaleString('de-DE',{maximumFractionDigits:d}):'–',
            avg:a=>a.reduce((n,x)=>n+x,0)/a.length,between:(x,a,b)=>x.date>=a&&x.date<=b,
            vk201ValidateFile:f=>f&&typeof f.name==='string'&&f.size>=1&&f.size<=1572864&&typeof f.base64==='string',
            vkReportTable:(labels,records)=>JSON.stringify(records),
