          vm.createContext(context);
          vm.runInContext(moduleCode,context);
          const valid=vm.runInContext('vk205HospitalValid',context);
          const base={id:'h1',admitted:'2026-10-25',discharged:'2026-10-27',hospital:'Fachklinik',department:'Pneumologie',diagnosis:'Test',treatment:'Test',notes:'Test',files:[]};
