          .vk205-preview>div{display:flex;align-items:center;justify-content:space-between;gap:10px}
          .vk205-preview>div strong{flex:1;overflow-wrap:anywhere}
          .vk205-preview img{display:block;max-width:100%;min-height:0;max-height:100%;object-fit:contain;flex:1}
          .vk205-preview iframe{width:100%;border:0;background:white;flex:1;min-height:0}
          .vk205-preview pre{overflow:auto;background:white;color:#172d40;padding:15px;border-radius:10px;flex:1}
          #hospital-form input,#hospital-form select,#hospital-form textarea{font-size:16px;min-height:48px}
          #main[data-section="hospital"] .panel{border-top:3px solid #317d96}
          @media print{.vk205-stay .actions,#hospital-form,.vk205-preview{display:none!important}}
          '''
          Path('style.css').write_text(Path('style.css').read_text(encoding='utf8')+css,encoding='utf8')
          sw=Path('sw.js').read_text(encoding='utf8')
          if 'vital-kompass-2.0.3-drawer-bmi-bsa' not in sw:raise RuntimeError('Offline-Cache nicht wie geprüft. Abbruch.')
          sw=sw.replace('VitalKompass 2.0.3','VitalKompass 2.0.5').replace('vital-kompass-2.0.3-drawer-bmi-bsa','vital-kompass-2.0.5-oxygen-pi')
          Path('sw.js').write_text(sw,encoding='utf8')
          # Im PDF werden Diagramm-Werte bisher nur mit etwa 6 pt ausgegeben.
          # Die Schriftgröße aus dem SVG respektieren und eine lesbare Untergrenze halten.
          pdfpath=Path('pdf-export.js'); pdf=pdfpath.read_text(encoding='utf8')
          pdfraw=pdf.encode('utf8')
          pdfsha=hashlib.sha1(('blob '+str(len(pdfraw))+'\0').encode()+pdfraw).hexdigest()
          if pdfsha!='a2677c37824fca7f8194fb2bbb80fa94f51e722c':
              raise RuntimeError('PDF-Renderer wurde zwischenzeitlich verändert; kein unkontrollierter Ersatz.')
          pdfold="const fs=8.5*scale+1.5;let tx=xx(el.getAttribute('x'));"
          pdfnew="const svgSize=parseFloat(el.getAttribute('font-size'))||11;const fs=Math.max(8.0,Math.min(11.5,svgSize*scale+1.7));let tx=xx(el.getAttribute('x'));"
          if pdf.count(pdfold)!=1:raise RuntimeError('PDF-Schriftgröße: unerwarteter Programmstand.')
          pdfpath.write_text(pdf.replace(pdfold,pdfnew),encoding='utf8')
          Path('version.json').write_text(json.dumps({'version':'2.0.5','released':'2026-10-29','notes':'SpO2 und PI mit getrennten Diagrammen, Krankenhausaufenthalte mit iPhone-Kamera- und PDF-Scan, kompakte Monats-/Jahresberichte mit Minimum/Mittelwert/Maximum statt doppelter Tabellen, überlappungsarme Diagrammbeschriftung, PDF-Auswahl, lokale verschlüsselte Daten und Offline-Modus.'},ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          readme=Path('README.md').read_text(encoding='utf8')
          Path('README.md').write_text(readme+'''\n\n## VitalKompass 2.0.5 – Blutsauerstoff und Perfusionsindex\n- Neuer gemeinsamer Menüpunkt „Blutsauerstoff & Durchblutung (PI)“: SpO₂ in Prozent (Pflicht), PI in Prozent (optional), Datum/Uhrzeit, Messsituation (Raumluft/Sauerstoff), Notiz.\n- Werte lokal AES-GCM verschlüsselt; bearbeiten/löschen. Alter Datensatz und Passwortspeicher bleiben unverändert.\n- Zwei unabhängige SVG-Diagramme: Tag, letzte 7 Tage, Woche, Monat, Jahr, 10 Jahre; zeitliche Mittelwerte sind entsprechend gekennzeichnet.\n- SpO₂-Ampel dient der allgemeinen Orientierung (≥95, 93–94, ≤92 %); individuelle klinische Zielwerte können abweichen. PI ohne universelle Ampelschwellen.\n- Beide Werte in Monats-/Jahresstatistik und separat auswählbaren PDF-Berichten enthalten. PDF-Export ist unverschlüsselt; nur sicher speichern.\n- Vor dem Installieren Backup speichern, Safari-Website-Daten nicht löschen. Kein direkter Hardware-Datenaustausch.\n''',encoding='utf8')
          Path('README.md').write_text(Path('README.md').read_text(encoding='utf8')+'''\n\n## VitalKompass 2.0.5 – Krankenhaus-Scans und kompakte Berichte\n- Krankenhausaufenthalte mit Aufnahme/Entlassung, Krankenhaus, Fachabteilung, Diagnosen, Behandlung, Nachsorge und iPhone-Kamerascan oder PDF-Upload. Originaldokumente bleiben verschlüsselt auf dem Gerät. Kein automatisches OCR.\n- Monats-/Jahresberichte: diagrammgestützte Messarten mit Minimum, Mittelwert und Maximum; keine doppelten Einzeltabellen.\n- Beschriftungen im SVG mit Kollisionsschutz und Ausdünnung bei vielen Messpunkten.\n- SpO₂ und PI im Bericht und PDF sowie Klinikaufenthalte als Berichtsthema.\n''',encoding='utf8')
          print('VitalKompass 2.0.5 vorbereitet: SpO2, PI, Klinikscans und kompakte Berichte.')
          PY_VK204
      - name: Syntax, Grenzwerte und Datenintegritaet pruefen
        shell: bash
        run: |
          node --check app.js
