          has('.vk204-last',css);has('vital-kompass-2.0.5-oxygen-pi',sw);
          assert(/data-view="glucose"[\s\S]*?Diabetes<\/button><button[^>]+data-view="urology"[\s\S]*?Prostata<\/button><button[^>]+data-view="bp"[\s\S]*?Blutdruck<\/button>/.test(app),'Bottom nav changed unexpectedly');
          const start=app.indexOf('function vk204OxygenValid('),end=app.indexOf('function vk204OxygenRows()');
          assert(start>0&&end>start,'Testable validation segment missing');
          const unit=app.slice(start,end)+'\n;({vk204OxygenValid,vk204SpO2Level})';
          const scope={dateValid:v=>/^2026-10-(0[1-9]|[12][0-9]|3[01])$/.test(v),today:()=> '2026-10-29',timeValid:v=>/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(v),Number};
          const f=vm.runInNewContext(unit,scope),good={id:'test',date:'2026-10-29',time:'10:11',spo2:96,pi:3.21,situation:'room',note:'Test'};
          for(const [changes,valid] of [ [{},true], [{pi:null},true], [{spo2:92},true], [{spo2:101},false], [{spo2:49},false], [{spo2:96.5},false], [{pi:0},false], [{pi:31},false], [{date:'2026-10-30'},false], [{time:'26:00'},false], [{situation:'mistake'},false], [{note:'x'.repeat(401)},false]]){
           assert.equal(f.vk204OxygenValid({...good,...changes}),valid,'Value validation: '+JSON.stringify(changes).slice(0,50));
          }
          for(const [x,expected] of [[98,'green'],[95,'green'],[94,'yellow'],[93,'yellow'],[92,'red'],[88,'red']])assert.equal(f.vk204SpO2Level(x).level,expected,'SpO2 traffic '+x);
          assert.equal(JSON.parse(fs.readFileSync('version.json','utf8')).version,'2.0.5');
          assert(!app.includes("const VERSION='2.0.3'"));
          assert(fs.readFileSync('pdf-export.js','utf8').includes('const fs=Math.max(8.0,Math.min(11.5,svgSize*scale+1.7))'),'PDF labels are not legible');

          const checks205=["function pageHospital()","function vk205HospitalSave(form)","function vk205HospitalReport(from,to,showList=true)","function vk205HospitalValid(s)","function vk205PointLabels(points,W,H,L,R,T,B,decimals=1)","if(sel('hospital'))","hospitalStays:[]","hospital:pageHospital","hospital-edit","hospital-view-file","name=\"scan\"","name=\"files\"","if(form.getAttribute('id')==='hospital-form')","if(action==='hospital-view-file')","function statsHtml(){","Minimum","Durchschnitt","Maximum","vk205PointLabels(rows.map(","vk205PointLabels(arr.map("];
          for(const x of checks205)assert(app.includes(x),'Missing 2.0.5: '+x);
          assert(app.includes('const VERSION=\'2.0.5\''),'Wrong version');
          assert(app.includes('DB=\'vitalkompass-secure-v1\''),'Encrypted storage key modified');
          const sd=app.indexOf('function statsHtml(){'),se=app.indexOf('function pageStatsOld(){',sd),report=app.slice(sd,se);
          assert(!report.includes('Messwerte (Auszug)'),'Redundant individual measurement table still present');
          assert(!report.includes('weightReportBlock(w)'),'Redundant weight table still present');
          assert(report.includes('vk205HospitalReport')&&report.includes("vk204OxygenChart('pi'"),'New measurements missing from statistics');
          assert(app.includes("['hospital','Krankenhausaufenthalte','Aufenthalte und dokumentierte Befunde']"),'Hospital report selection missing');
          console.log('2.0.5: Hospitalization and scanning, encrypted backup, min/mean/max, oxygen and PI, chart labels and PDF report integration tested.');
          console.log('SUCCESS: Syntax, 3-button bottom nav, oxygen/PI save/edit/delete, all time periods, PDF, stats, backup validation and 18 SpO₂/PI unit checks.');
          {
