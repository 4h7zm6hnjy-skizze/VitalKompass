          a=Path('app.js').read_text()
          d=Path('vk214-documents.js').read_text()
          v=json.loads(Path('version.json').read_text())
          assert v['version']=='2.0.16'
          assert "const VERSION='2.0.16'" in a
          assert "function pageVital()" in a
          assert 'specialtyFindings' in a and 'specialtyAppointments' in a
          assert "window.VK216.home(data)" in a
          assert 'Pneumologie' in d and 'ophthalmology' in d
          assert "vk216-specialties.js" in Path('index.html').read_text()
          assert "vk216-specialties.js" in Path('sw.js').read_text()
          print('Navigation, Vital, Facharztberichte, Dokumente und Offline-Cache vorhanden')
          PY_CHECK
      - name: PSA-, Fachrichtungs- und Kacheltests mit Testdaten
        shell: bash
        run: |
          node <<'JS_TEST'
          const fs=require('fs'),assert=require('node:assert/strict'),vm=require('vm');
          const context={window:{VK214:{files:()=>[]},VK_HBA1C:{latestLab:()=>null}},Date,Number,Array,Math,String,RegExp,Set,Map,Intl,console};
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('vk216-specialties.js','utf8'),context);
          const mod=context.window.VK216;
          const empty={profile:{birthday:'1988-09-01',name:'Testpatient'},labs:[],measurements:[],weights:[],oxygenLogs:[],asthmaLogs:[],urologyLogs:[],hospitalStays:[],meds:[],specialtyFindings:[],specialtyAppointments:[]};
          assert.equal(Object.keys(mod.SPECS).length,6);
          assert.equal(mod.psa(empty).level,'gray');
          let a=structuredClone(empty);
          a.labs=[{name:'PSA gesamt',date:'2026-10-15',value:3.4,unit:'ng/ml',verified:true}];
          assert.equal(mod.psa(a).level,'gray','Unter 45 keine pauschale Krebs-Screeningampel');
          a.profile.birthday='1968-09-01';
          assert.equal(mod.psa(a).level,'yellow','Erstmalig PSA >=3: Kontrollmessung');
          a.labs.push({name:'PSA gesamt',date:'2026-11-01',value:3.8,unit:'ng/ml',verified:true});
          assert.equal(mod.psa(a).level,'red','Wiederholter PSA >=3: urologische Abklärung');
          a.labs.push({name:'PSA frei',date:'2026-11-01',value:0.76,unit:'ng/ml',verified:true});
          assert.equal(Math.round(mod.psa(a).ratio),20);
          assert.equal((mod.home(empty).match(/class="vk216-home-card/g)||[]).length,7,'Genau sieben Startkacheln');
          for(const key of Object.keys(mod.SPECS)){
            const body=mod.page(empty,key);
            assert(body.includes('data-vk216-report="'+key+'"'),key+' Arztbericht');
            assert(mod.doctorHTML(empty,key).includes('Facharzt:'),key+' Arzt-PDF');
          }
          console.log('Alle Fachrichtungen, PSA-Grenzfaelle, 7 Startkacheln und Arztberichte geprüft.');
          JS_TEST
          python3 - <<'PY_FILES'
          from pathlib import Path
          import subprocess
          allowed={'app.js','vk214-documents.js','vk216-specialties.js','style.css','index.html','sw.js','version.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed|untracked==allowed, f'Unerwartete Dateien: {changed|untracked}'
          print('Keine Datenbank-, Passwort- oder Originaldatei verändert.')
          PY_FILES
