      - name: JavaScript und Versionsdateien pruefen
        shell: bash
        run: |
          node --check app.js
          node --check hba1c.js
          node --check vk214-documents.js
          node --check vkpro.js
          node --check pdf-export.js
          node --check sw.js
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import json
          app=Path('app.js').read_text()
          ver=json.loads(Path('version.json').read_text())
          assert ver['version']=='2.0.15'
          assert app.count("const VERSION='2.0.15'")==1
          assert 'window.VK214.page' in app and 'window.VK_HBA1C.homeCard' in app
          assert 'vk215AnalysisTab' in app and 'vk215-vital-grid' in app
          assert 'vk214-documents.js' in Path('index.html').read_text()
          assert 'vital-kompass-2.0.15-restructured' in Path('sw.js').read_text()
          print('Versionswechsel, Dokumente, Startseite, Analysen und Cache nachgewiesen.')
          PY_CHECK
          git diff --check
      - name: Benutzeroberflaeche Datenschutz Originale und HbA1c testen
        shell: bash
        run: |
          node "$RUNNER_TEMP/vk215-tests.cjs"
          python3 - <<'PY_FILES'
          import subprocess
          allowed={"app.js","vk214-documents.js","style.css","sw.js","version.json"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed==allowed, f"Unerwartete bearbeitete Dateien: {changed!r}"
          print("Geschuetzt: keine Datenbankdatei, kein Originaldokument, kein Passwort, keine Gesundheitsdaten-Datei veraendert.")
          PY_FILES
      - name: Einmaliges Gesamtupdate veroeffentlichen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js vk214-documents.js style.css sw.js version.json
          if git diff --cached --quiet; then
            echo "Alle Dateien sind bereits auf Version 2.0.15."
          else
            git commit -m "VitalKompass 2.0.15: einheitliche Navigation, Dokumente, Berichte und Datenschutz"
            git push origin HEAD:main
          fi
