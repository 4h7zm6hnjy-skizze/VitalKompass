           data:structuredClone(initial),weightSaveInProgress:false,weightJournalReadOnly:false,toast(){},renderMain(){},save:async()=>{saves++;if(saveThrows)throw Error('Speicherfehler')},writeWeightDraft:async()=>{},storeWeightJournal:async()=>{weightSaves++},syncProfileWeight(){},clearWeightDraft:async()=>{},
