           gLabels:{fasting:'Nüchtern',before:'Vor dem Essen',after:'Nach dem Essen',other:'Sonstige'},bpMealLabels:{unknown:'Keine Angabe',before_breakfast:'Vor dem Frühstück',after_breakfast:'Nach dem Frühstück',before_lunch:'Vor Mittag',after_lunch:'Nach Mittag'},VK_URO_KINDS:{prostate:'Prostata'},vkUroValidate:()=>true,
