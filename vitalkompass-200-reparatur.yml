          assert(pdf.includes("if(t==='polyline')"),'PDF muss durchgezogene Linien zeichnen');
          const begin='/* VK200 MODULE BEGIN',end='/* VK200 MODULE END */';
          assert(app.indexOf(begin)>0 && app.indexOf(end)>app.indexOf(begin));
          const ext=app.slice(app.indexOf(begin),app.indexOf(end)+end.length);
          const today='2026-10-21';
          const fakeSvg=()=>'<div class="chartwrap"><svg viewBox="0 0 400 200"><polyline points="0,0 1,1"/></svg></div>';
          const rows={
           bp:[{date:'2026-10-20',time:'07:00',sys:123,dia:78,pulse:66}],
           glucose:[{date:'2026-10-20',time:'07:05',mgdl:96,period:'fasting'}],
