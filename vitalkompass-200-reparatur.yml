           pagePSAFast:()=>'',vkMiniTrend:()=>fakeSvg(),lineChart:()=>fakeSvg(),weightChart:()=>fakeSvg(),
           vkDocRows:()=>rows,vkStats:(a,key)=>({n:a.length,mean:a.length?a.reduce((n,x)=>n+x[key],0)/a.length:NaN,min:a.length?Math.min(...a.map(x=>x[key])):NaN,max:a.length?Math.max(...a.map(x=>x[key])):NaN}),
           fmtDate:s=>s,nf:n=>Number.isFinite(n)?String(n):'–',gLabels:{fasting:'Nüchtern'},bpMealLabels:{before_breakfast:'Vor dem Frühstück'},
           sortdate:(a,b)=>((a.date||'')+' '+(a.time||'')).localeCompare((b.date||'')+' '+(b.time||'')),
          between:(x,from,to)=>x.date>=from&&x.date<=to,
           data:{profile:{name:'Test',birthday:'',height:'',conditions:[],allergies:[],contact:[]},urologyLogs:[{id:'u',type:'ipss',date:'2026-10-20',time:'10:00',ipss:[1,1,1,1,1,1,1],score:7,qol:1}],labs:[{name:'PSA gesamt',date:'2026-10-20',value:1.1,verified:true,unit:'ng/ml'}],meds:[],medTakes:[],symptoms:[],reminders:[],evidence:[],checks:{}},
           reportChoice:{weight:true},rangeDays:()=> '2026-09-21',VK_REPORT_KEYS:null
          };
          vm.runInNewContext(ext+'\nglobalThis.vk200={vkUroValidate,vkAllTopicHtml,vkFastingInfo,VK_REPORT_TOPICS,VK_REPORT_KEYS,vkUroIPSSLabel};',ctx);
          const T=ctx.vk200;
          assert(T.VK_REPORT_TOPICS.length>=18);
          assert.equal(new Set(T.VK_REPORT_TOPICS.map(x=>x[0])).size,T.VK_REPORT_TOPICS.length);
          assert(T.VK_REPORT_KEYS.has('urology'));
          const example={id:'a',type:'entry',date:'2026-10-20',time:'07:15',kind:'prostate',severity:'mild',day:6,night:2,note:'',finding:''};
