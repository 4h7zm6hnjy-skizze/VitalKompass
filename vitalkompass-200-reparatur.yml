          a=once(a,"weight:pageWeight,asthma:pageAsthma,doctor:pageDoctorReport", "weight:pageWeight,urology:pageUrology,asthma:pageAsthma,doctor:pageReportPlus")
          # Fasting explanations, with source links, placed in the existing measurement modules.
          a=once(a,"+photoNote() +panel('Accu-Chek Instant", "+photoNote()+vkFastingInfo('glucose')+panel('Accu-Chek Instant")
          a=once(a,"tag('Laborwerte','Umfangreicher Labor-Katalog mit Diabetes-, PSA-/Prostata-, Eisen-, Nieren-, Leber- und weiteren Werten.')+warningBox", "tag('Laborwerte','Umfangreicher Labor-Katalog mit Diabetes-, PSA-/Prostata-, Eisen-, Nieren-, Leber- und weiteren Werten.')+vkFastingInfo('labs')+warningBox")
          # One independent module; no third-party libraries or network access.
