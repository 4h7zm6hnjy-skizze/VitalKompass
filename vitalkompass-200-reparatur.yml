          a=once(a,"const from=String(f.get('from')||''),to=String(f.get('to')||''),parts=f.getAll('part').map(String);const allowed=['bp','glucose','weight','asthma','labs','meds'];", "const [from,to]=vkReportDateRange(form),parts=f.getAll('part').map(String);const allowed=VK_REPORT_TOPICS.map(x=>x[0]);")
          a=once(a,"makePrint('Individueller Arztbericht',vkDoctorHtml(from,to,reportChoice));return;", "makePrint('Individueller Arztbericht',vkAllTopicHtml(from,to,reportChoice));return;")
          # Print one specific topic directly, select/deselect all, edit/delete urology safely.
