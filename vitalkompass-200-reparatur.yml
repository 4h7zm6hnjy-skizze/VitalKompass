          sw=once(sw,"vital-kompass-1.9.8-fixed-view","vital-kompass-2.0.0-urology-reports")
          css+='\n'+Path('/tmp/vk200_style.css').read_text(encoding='utf-8')
          version={'version':'2.0.0','released':'2026-10-21','notes':'Urologie und Prostata mit eigenem verschlüsselten Tagebuch, PSA-Verlauf, IPSS, Untersuchungsinformationen und Nüchtern-Erklärungen. Alle Gesundheitsthemen einzeln oder gemeinsam als PDF, Messwertdiagramme inklusive. Bestehende Daten und feste iPhone-Ansicht bleiben erhalten.'}
          for path,contents in [('app.js',a),('sw.js',sw),('style.css',css),('version.json',json.dumps(version,ensure_ascii=False,indent=2)+'\n')]:
