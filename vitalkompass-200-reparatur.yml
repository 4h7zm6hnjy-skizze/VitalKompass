           'version.json':'2d448a40775aea56eb384064ce5e36cd4dfb1ca0'
          }
          def read(path):
           raw=Path(path).read_bytes()
           sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
